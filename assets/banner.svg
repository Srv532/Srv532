<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      .t{font-family:'Arial Black','Segoe UI',Arial,sans-serif;font-weight:900}
      .f1{animation:f1 5s ease-in-out infinite}
      .f2{animation:f2 6s ease-in-out infinite}
      .f3{animation:f3 4.5s ease-in-out infinite}
      .spin{transform-origin:800px 70px;animation:sp 12s linear infinite}
      .pop{animation:pop 3s ease-in-out infinite;transform-origin:450px 130px}
      @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
      @keyframes f3{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
      @keyframes sp{to{transform:rotate(360deg)}}
      @keyframes pop{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
    </style>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#111"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="888" height="248" rx="14" fill="#111"/>
  <rect x="2" y="2" width="888" height="248" rx="14" fill="#f5f1e8" stroke="#111" stroke-width="4"/>
  <rect x="2" y="2" width="888" height="248" rx="14" fill="url(#dots)" opacity=".12"/>

  <g class="f1"><circle cx="90" cy="64" r="34" fill="#ff5a36" stroke="#111" stroke-width="4"/></g>
  <g class="f2"><rect x="700" y="150" width="70" height="70" rx="10" fill="#3a6df0" stroke="#111" stroke-width="4"/></g>
  <g class="f3"><polygon points="830,205 872,240 788,240" fill="#00c46a" stroke="#111" stroke-width="4" stroke-linejoin="round"/></g>
  <g class="spin" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round">
    <path d="M800 40v60M770 70h60M778 48l44 44M822 48l-44 44"/>
  </g>
  <circle cx="120" cy="214" r="9" fill="#ffd60a" stroke="#111" stroke-width="4"/>

  <g class="pop">
    <text class="t" x="458" y="140" font-size="80" text-anchor="middle" fill="#111">SRAVAN SHAJI</text>
    <text class="t" x="450" y="132" font-size="80" text-anchor="middle" fill="#ffd60a" stroke="#111" stroke-width="3" paint-order="stroke">SRAVAN SHAJI</text>
  </g>
  <rect x="266" y="158" width="372" height="40" rx="8" fill="#111"/>
  <rect x="260" y="152" width="372" height="40" rx="8" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="446" y="179" font-family="Consolas,'Courier New',monospace" font-weight="700" font-size="20" text-anchor="middle" fill="#111">cyber security</text>
</svg>
