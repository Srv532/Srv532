<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="190" height="238">
  <style>
    .bob{animation:bob 3s ease-in-out infinite}
    .eye{animation:eye 1.6s ease-in-out infinite}
    .halo{animation:halo 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .scan{animation:scan 2.4s ease-in-out infinite}
    .jaw{animation:jaw 2.8s ease-in-out infinite;transform-origin:120px 96px}
    .piston{animation:pis 1.8s ease-in-out infinite}
    .core{animation:core 1.2s ease-in-out infinite}
    .armR{animation:arm 3s ease-in-out infinite;transform-origin:182px 138px}
    .shadow{animation:sh 3s ease-in-out infinite;transform-origin:120px 288px}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes eye{0%,100%{opacity:1}50%{opacity:.55}}
    @keyframes halo{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.6);opacity:.1}}
    @keyframes scan{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
    @keyframes jaw{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(4deg)}90%{transform:rotate(-2deg)}}
    @keyframes pis{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes core{0%,100%{fill:#ff2a1a}50%{fill:#ffd60a}}
    @keyframes arm{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
    @keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
  </style>
  <ellipse class="shadow" cx="120" cy="288" rx="64" ry="8" fill="#000" opacity=".4"/>
  <g class="bob" stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs -->
    <rect x="86" y="206" width="22" height="40" rx="5" fill="#8b95a5"/>
    <rect x="132" y="206" width="22" height="40" rx="5" fill="#8b95a5"/>
    <circle cx="97" cy="248" r="9" fill="#2b2f38"/><circle cx="143" cy="248" r="9" fill="#2b2f38"/>
    <rect x="89" y="252" width="16" height="26" rx="4" fill="#b8c0cc"/>
    <rect x="135" y="252" width="16" height="26" rx="4" fill="#b8c0cc"/>
    <rect x="80" y="274" width="34" height="12" rx="4" fill="#2b2f38"/>
    <rect x="126" y="274" width="34" height="12" rx="4" fill="#2b2f38"/>
    <!-- pelvis -->
    <path d="M82 196h76l-10 20h-56z" fill="#b8c0cc"/>
    <!-- spine -->
    <g fill="#8b95a5"><rect x="110" y="104" width="20" height="10" rx="3"/><rect x="108" y="116" width="24" height="10" rx="3"/><rect x="108" y="128" width="24" height="10" rx="3"/><rect x="108" y="140" width="24" height="10" rx="3"/><rect x="108" y="152" width="24" height="10" rx="3"/><rect x="108" y="164" width="24" height="10" rx="3"/><rect x="108" y="176" width="24" height="10" rx="3"/><rect x="110" y="188" width="20" height="10" rx="3"/></g>
    <!-- ribs -->
    <g fill="none" stroke="#111" stroke-width="12"><path d="M106 124Q68 124 70 150"/><path d="M106 144Q64 144 66 170"/><path d="M106 164Q66 164 70 188"/><path d="M134 124Q172 124 170 150"/><path d="M134 144Q176 144 174 170"/><path d="M134 164Q174 164 170 188"/></g>
    <g fill="none" stroke="#b8c0cc" stroke-width="6"><path d="M106 124Q68 124 70 150"/><path d="M106 144Q64 144 66 170"/><path d="M106 164Q66 164 70 188"/><path d="M134 124Q172 124 170 150"/><path d="M134 144Q176 144 174 170"/><path d="M134 164Q174 164 170 188"/></g>
    <!-- power core -->
    <circle class="core" cx="120" cy="150" r="9" fill="#ff2a1a"/>
    <!-- left arm -->
    <circle cx="68" cy="126" r="12" fill="#2b2f38"/>
    <rect x="48" y="132" width="18" height="46" rx="6" fill="#8b95a5"/>
    <circle cx="57" cy="180" r="9" fill="#2b2f38"/>
    <rect x="50" y="184" width="14" height="30" rx="5" fill="#b8c0cc"/>
    <rect x="47" y="212" width="20" height="14" rx="4" fill="#2b2f38"/>
    <!-- right arm -->
    <g class="armR">
      <circle cx="172" cy="126" r="12" fill="#2b2f38"/>
      <rect x="174" y="132" width="18" height="46" rx="6" fill="#8b95a5"/>
      <circle cx="183" cy="180" r="9" fill="#2b2f38"/>
      <rect x="176" y="184" width="14" height="30" rx="5" fill="#b8c0cc"/>
      <rect x="173" y="212" width="20" height="14" rx="4" fill="#2b2f38"/>
      <g class="piston" stroke-width="3"><rect x="192" y="140" width="6" height="30" rx="2" fill="#ffd60a"/></g>
    </g>
    <!-- skull -->
    <path d="M70 62a50 46 0 0 1 100 0v22q0 12-10 14H80q-10-2-10-14z" fill="#b8c0cc"/>
    <path d="M84 40q36-16 72 0" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/>
    <!-- eye sockets -->
    <ellipse cx="96" cy="68" rx="15" ry="13" fill="#111"/>
    <ellipse cx="144" cy="68" rx="15" ry="13" fill="#111"/>
    <circle class="halo" cx="96" cy="68" r="9" fill="#ff2a1a" stroke="none"/>
    <circle class="halo" cx="144" cy="68" r="9" fill="#ff2a1a" stroke="none"/>
    <circle class="eye" cx="96" cy="68" r="7" fill="#ff2a1a" stroke="none"/>
    <circle class="eye" cx="144" cy="68" r="7" fill="#ff2a1a" stroke="none"/>
    <circle cx="94" cy="66" r="2.5" fill="#fff" stroke="none"/><circle cx="142" cy="66" r="2.5" fill="#fff" stroke="none"/>
    <!-- brow -->
    <path d="M78 54l34 10M162 54l-34 10" fill="none" stroke="#111" stroke-width="6"/>
    <!-- nose -->
    <path d="M120 78l-7 16h14z" fill="#111"/>
    <!-- cheek plates -->
    <path d="M76 82l10 14M164 82l-10 14" fill="none" stroke="#111" stroke-width="3"/>
    <!-- jaw -->
    <g class="jaw">
      <path d="M82 100h76v14q0 10-10 10H92q-10 0-10-10z" fill="#8b95a5"/>
      <g stroke-width="3"><path d="M96 100v24M108 100v24M120 100v24M132 100v24M144 100v24"/></g>
    </g>
    <!-- scan strip on forehead -->
    <g stroke="none"><rect x="90" y="44" width="60" height="5" rx="2.5" fill="#2b2f38"/><rect class="scan" x="114" y="44" width="12" height="5" rx="2.5" fill="#ff2a1a"/></g>
    <!-- damage / rivets -->
    <g fill="#2b2f38" stroke="none"><circle cx="82" cy="50" r="2.5"/><circle cx="158" cy="50" r="2.5"/></g>
  </g>
</svg>
